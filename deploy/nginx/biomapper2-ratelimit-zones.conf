# biomapper2 engine rate-limit zones (http context).
#
# Install to /etc/nginx/conf.d/biomapper2-ratelimit-zones.conf. Files in conf.d
# are included inside the http {} block by the stock Ubuntu nginx.conf.
# The matching per-location limits live in biomapper2-ratelimit-locations.conf,
# which is included inside the certbot-managed server block.
# Apply, verify and roll-back steps: deploy/README.md, "Rate limiting (nginx)".

# Hosts exempt from the PER-IP limit. biomapper-ui runs on this same Lightsail
# host and calls the engine through the public URL, so every UI user arrives
# from the host's own address. Without this exemption, all UI users would share
# one per-IP bucket. Exempt hosts still count against the global
# connection cap below.
geo $biomapper2_ratelimit_exempt {
    default           0;
    127.0.0.1/32      1;
    ::1/128           1;
    # Lightsail static IP of expert-in-the-loop-upgraded (see deploy/README.md).
    35.161.242.62/32  1;
    # If the access log shows the UI's requests arriving from the instance's
    # private VPC address instead, add it here, for example:
    # 172.26.x.y/32   1;
}

# An empty key means limit_req does not count the request.
map $biomapper2_ratelimit_exempt $biomapper2_ratelimit_key {
    1        "";
    default  $binary_remote_addr;
}

# Per-client request rate on the mapping mounts.
limit_req_zone $biomapper2_ratelimit_key zone=biomapper2_map_per_ip:10m rate=1r/s;

# GLOBAL concurrency on the mapping mounts: one shared key for the whole
# server block, so total load is bounded no matter how many clients exist.
limit_conn_zone $server_name zone=biomapper2_map_global:1m;
