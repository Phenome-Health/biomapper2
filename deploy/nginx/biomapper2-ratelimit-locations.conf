# biomapper2 engine rate-limited locations (server context).
#
# Copy to /etc/nginx/snippets/ and include it inside the certbot-managed
# `server { listen 443 ssl; server_name biomapper.expertintheloop.io; ... }`
# block, next to the existing `location /`:
#
#     include /etc/nginx/snippets/biomapper2-ratelimit-locations.conf;
#
# Copy it rather than including it from the repo checkout: deploy-api.yml runs
# `git reset --hard origin/main` on the host, which would otherwise change the
# live nginx config at the next reload without an `nginx -t`.
#
# Requires the zones in biomapper2-ratelimit-zones.conf (http context).
#
# Both mapping mounts reach the same router (src/biomapper2/api/main.py mounts
# mapping.router at /api/v1/map and at the /map alias), so both are limited.
# Discovery (/api/v1/*, /discovery/*) and health stay on the existing
# `location /` and are NOT throttled.
#
# A more specific location does not inherit proxy_* directives from
# `location /`, so each location repeats the full proxy setup.
#
# limit_conn 2 matches `--workers 2` in deploy/biomapper2-api.service.
#
# proxy_ignore_client_abort keeps the request (and so its limit_conn slot) alive
# until the upstream answers. Without it, nginx frees the slot when the client
# disconnects, but the engine's synchronous mapping keeps running, so a client
# could disconnect and resubmit past the global cap.

location /api/v1/map/ {
    limit_req  zone=biomapper2_map_per_ip burst=10 nodelay;
    limit_conn biomapper2_map_global 2;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_ignore_client_abort on;
}

location /map/ {
    limit_req  zone=biomapper2_map_per_ip burst=10 nodelay;
    limit_conn biomapper2_map_global 2;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_ignore_client_abort on;
}
